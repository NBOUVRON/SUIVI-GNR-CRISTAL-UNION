<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--yellow:#f0b400;--dark:#17202a;--bg:#f4f5f7;--card:#fff;--muted:#667085;--ok:#177245;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--dark)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:780px;margin:auto;min-height:100vh}.top{background:#111923;color:#fff;padding:14px 16px 12px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:11px}.brand img{width:54px;height:54px;border-radius:14px;object-fit:cover}.brand h1{font-size:20px;margin:0}.brand small{color:#d7dce2}.bar{display:flex;gap:7px;margin-top:11px;overflow:auto;padding-bottom:2px}.tab{border:0;background:#263240;color:#fff;padding:9px 12px;border-radius:12px;white-space:nowrap}.tab.active{background:var(--yellow);color:#111}.main{padding:15px}.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:13px;box-shadow:0 2px 10px #0000000d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{border:0;border-radius:20px;padding:16px;text-align:left;background:#eef1f4;min-height:110px;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;color:#fff;background-image:linear-gradient(160deg,var(--c1,#8fa1b3),var(--c2,#5c6b7a));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -10px 14px rgba(0,0,0,.08),0 7px 0 rgba(0,0,0,.16),0 12px 20px rgba(0,0,0,.18);transition:transform .12s ease,box-shadow .12s ease}.tile:active{transform:translateY(5px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -6px 10px rgba(0,0,0,.1),0 2px 0 rgba(0,0,0,.16),0 4px 8px rgba(0,0,0,.18)}.tile-alert{animation:pulseAlert 1.6s ease-in-out infinite}@keyframes pulseAlert{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -10px 14px rgba(0,0,0,.08),0 7px 0 rgba(0,0,0,.16),0 0 0 3px rgba(255,70,70,.6),0 12px 20px rgba(255,60,60,.3)}50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -10px 14px rgba(0,0,0,.08),0 7px 0 rgba(0,0,0,.16),0 0 0 7px rgba(255,70,70,.25),0 12px 26px rgba(255,60,60,.5)}}.tile-badge{position:absolute;top:-6px;right:-6px;background:#ff3b30;color:#fff;font-size:12px;font-weight:800;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.35)}.tile-icon{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:inset 0 2px 3px rgba(255,255,255,.55),inset 0 -3px 5px rgba(0,0,0,.18)}.tile b{display:block;font-size:14.5px;letter-spacing:.2px;text-shadow:0 1px 1px rgba(0,0,0,.15)}.tile .muted{color:rgba(255,255,255,.88)}.muted{color:var(--muted);font-size:13px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field input,.field textarea,.field select{border:1px solid #d0d5dd;border-radius:12px;padding:11px;background:#fff}.primary{background-image:linear-gradient(160deg,#ffd25c,var(--yellow));border:0;border-radius:14px;padding:13px 16px;font-weight:800;color:#3a2900;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 5px 0 #b9820a,0 8px 14px rgba(0,0,0,.18);transition:transform .12s ease,box-shadow .12s ease}.primary:active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 1px 0 #b9820a,0 2px 6px rgba(0,0,0,.18)}.secondary{background-image:linear-gradient(160deg,#fff,#e4e7eb);border:0;border-radius:14px;padding:10px 13px;font-weight:600;color:#33404c;box-shadow:inset 0 1px 0 #fff,0 4px 0 #c7ccd2,0 6px 10px rgba(0,0,0,.12);transition:transform .12s ease,box-shadow .12s ease}.secondary:active{transform:translateY(3px);box-shadow:inset 0 1px 0 #fff,0 1px 0 #c7ccd2,0 2px 4px rgba(0,0,0,.12)}.check{background-image:linear-gradient(160deg,#22a866,var(--ok));color:#fff;border:0;border-radius:14px;padding:11px 14px;font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 0 #0e5c34,0 8px 14px rgba(0,0,0,.18);transition:transform .12s ease,box-shadow .12s ease}.check:active{transform:translateY(4px);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 1px 0 #0e5c34,0 2px 6px rgba(0,0,0,.18)}.check.locked{background:#98a2b3;background-image:none;box-shadow:none;cursor:not-allowed}.schedule{overflow:auto}.schedule table{width:100%;border-collapse:collapse;min-width:620px}.schedule th,.schedule td{padding:9px;border-bottom:1px solid #eaecf0;text-align:left}.login{padding:25px 18px}.hero{width:100%;max-width:360px;display:block;margin:0 auto 15px;border-radius:22px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111923;color:#fff;padding:12px 16px;border-radius:12px;display:none;z-index:20;max-width:90%;text-align:center}.hidden{display:none!important}.danger{color:var(--danger)}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef1f4;font-size:12px}.note{border-left:4px solid var(--yellow);padding-left:11px}.empty{padding:18px;text-align:center;color:var(--muted)}
#splash{position:fixed;inset:0;z-index:9999;background:#111923;display:flex;align-items:center;justify-content:center;opacity:1;visibility:visible;transition:opacity .45s ease,visibility .45s ease}
#splash img{width:100%;height:100%;object-fit:cover;object-position:center}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}

<body>
<div id="splash" aria-label="Cahier de RELÈVE">
  <img src="splash.png" alt="Cahier de RELÈVE">
</div>
<script>
  // Le splash démarre immédiatement, sans dépendre du réseau ni du chargement de Supabase.
  setTimeout(()=>{
    const splash=document.getElementById('splash');
    if(splash){ splash.classList.add('hide'); setTimeout(()=>splash.remove(),700); }
  },5000);

<div id="app"></div><div id="toast" class="toast"></div>
<script src="firebase-config.js"></script>
<script>
const FB=window.FIREBASE_CONFIG;
const FB_API='https://identitytoolkit.googleapis.com/v1';
const FS_API='https://firestore.googleapis.com/v1/projects/'+FB.projectId+'/databases/(default)/documents';
const state={user:null,profile:null,tab:'accueil',day:new Date().toISOString().slice(0,10),loading:false};
const TEAM=['Fabrice','Lilian','Antonin','Lukasz','Dimitri'];
const MECA_CODE='2468';
const ARCIS_COORDS={lat:48.53,lon:4.13,label:'Arcis-sur-Aube'};
async function getWeather(){if(state.weather)return state.weather;let coords=ARCIS_COORDS;try{const pos=await new Promise((res,rej)=>{if(!navigator.geolocation)return rej();navigator.geolocation.getCurrentPosition(res,rej,{timeout:4000,maximumAge:600000})});coords={lat:pos.coords.latitude,lon:pos.coords.longitude,label:'Ma position'}}catch(e){}try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current_weather=true`);const d=await r.json();state.weather={temp:Math.round(d.current_weather.temperature),label:coords.label}}catch(e){state.weather={temp:null,label:coords.label}}return state.weather}
const ALL=['Fabrice','Lilian','Dimitri','Lukasz','Antonin','Jean-Yves','Nico','Charles'];
const $=id=>document.getElementById(id);
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.style.display='none',2800)}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})}
function shiftFor(name,date){const dt=new Date(date+'T12:00:00');if(date>='2026-09-15'&&date<='2026-09-21'){const dow=dt.getDay();if(name==='Fabrice'||name==='Lilian'||name==='Lukasz'){return(dow>=1&&dow<=4)?'Journée':'Repos'}if(name==='Dimitri'||name==='Antonin'){return(dow===6||dow===0)?'Repos':'Journée'}}const start=new Date('2026-09-22T12:00:00');let n=Math.floor((dt-start)/86400000);if(n<0)return 'Journée';const slot=Math.floor(n/2);const col=['Matin 05:00–13:00','Après-midi 13:00–21:00','Nuit 21:00–05:00','Repos'];const anchors={Fabrice:2,Lilian:3,Dimitri:0,Lukasz:1,Antonin:0};return col[(slot+(anchors[name]||0))%4]||'Journée'}
function isMgmt(){return state.profile?.role==='management'}
function isNico(){return state.profile?.display_name==='Nico'}
function token(){return localStorage.getItem('firebase_id_token')||''}
function userId(){return localStorage.getItem('firebase_uid')||''}
function fsValue(v){if(v===null||v===undefined)return {nullValue:null};if(typeof v==='string')return {stringValue:v};if(typeof v==='boolean')return {booleanValue:v};if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};if(v instanceof Date)return {timestampValue:v.toISOString()};return {stringValue:String(v)}}
function fsFields(obj){const f={};for(const [k,v] of Object.entries(obj))f[k]=fsValue(v);return f}
function fromFsValue(v){if(!v)return null;if('stringValue'in v)return v.stringValue;if('integerValue'in v)return Number(v.integerValue);if('doubleValue'in v)return v.doubleValue;if('booleanValue'in v)return v.booleanValue;if('timestampValue'in v)return v.timestampValue;if('nullValue'in v)return null;return v}
function fromFsDoc(doc){const o={id:doc.name.split('/').pop()};for(const [k,v] of Object.entries(doc.fields||{}))o[k]=fromFsValue(v);return o}
async function fbFetch(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{}),...(token()?{Authorization:'Bearer '+token()}: {})}});const text=await r.text();let data={};try{data=text?JSON.parse(text):{}}catch{data={message:text}}if(!r.ok)throw Object.assign(new Error(data.error?.message||data.message||('HTTP '+r.status)),{status:r.status,code:data.error?.status});return data}
async function fsGet(collection,id){const d=await fbFetch(FS_API+'/'+collection+'/'+encodeURIComponent(id));return fromFsDoc(d)}
async function fsQuery(collection,whereField,whereValue,orderField='created_at',desc=true){const body={structuredQuery:{from:[{collectionId:collection}]}};if(whereField)body.structuredQuery.where={fieldFilter:{field:{fieldPath:whereField},op:'EQUAL',value:fsValue(whereValue)}};const rows=await fbFetch(FS_API+':runQuery',{method:'POST',body:JSON.stringify(body)});const out=rows.filter(x=>x.document).map(x=>fromFsDoc(x.document));if(orderField)out.sort((a,b)=>{const av=a[orderField]||'',bv=b[orderField]||'';return (av<bv?1:av>bv?-1:0)*(desc?-1:1)});return out}
async function fsAdd(collection,obj,id=null){const url=FS_API+'/'+collection+(id?'/'+encodeURIComponent(id):'');const r=await fbFetch(url,{method:id?'PATCH':'POST',body:JSON.stringify({fields:fsFields(obj)})});return fromFsDoc(r)}
async function fsDelete(collection,id){await fbFetch(FS_API+'/'+collection+'/'+encodeURIComponent(id),{method:'DELETE'})}
async function authRequest(path,body){const r=await fetch(FB_API+path+'?key='+encodeURIComponent(FB.apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Object.assign(new Error(data.error?.message||'Erreur Firebase'),{status:r.status,code:data.error?.message});return data}
async function signIn(){try{const e=$('email').value.trim().toLowerCase(),p=$('pass').value;if(!e||!p)return toast('Renseigne ton email et ton mot de passe');const r=await authRequest('/accounts:signInWithPassword',{email:e,password:p,returnSecureToken:true});localStorage.setItem('firebase_id_token',r.idToken);localStorage.setItem('firebase_refresh_token',r.refreshToken);localStorage.setItem('firebase_uid',r.localId);localStorage.setItem('firebase_email',r.email||e);state.user={uid:r.localId,email:r.email||e};await load();}catch(err){toast('Connexion impossible : '+(err.code==='EMAIL_NOT_FOUND'||err.code==='INVALID_PASSWORD'?'Email ou mot de passe incorrect':err.message))}}
async function resetPassword(){const e=$('email').value.trim().toLowerCase();if(!e)return toast('Renseigne ton email');try{await authRequest('/accounts:sendOobCode',{requestType:'PASSWORD_RESET',email:e});toast('Email de réinitialisation envoyé')}catch(err){toast('Impossible d’envoyer l’email : '+err.message)}}
async function signOut(){localStorage.removeItem('firebase_id_token');localStorage.removeItem('firebase_refresh_token');localStorage.removeItem('firebase_uid');state.user=null;state.profile=null;render()}
async function load(){const uid=userId();if(!uid||!token()){state.user=null;return render()}state.user={uid,email:localStorage.getItem('firebase_email')||''};try{state.profile=await fsGet('profiles',uid);if(!state.profile)toast('Profil Firebase introuvable.');}catch(err){state.profile=null;toast('Profil indisponible : '+err.message)}render()}
function login(){document.querySelector('#app').innerHTML=`<div class="login"><img class="hero" src="icon.png"><div class="card"><h2>Cahier de RELÈVE</h2><p class="muted">Cristal Union · Épandage Arcis-sur-Aube</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Mot de passe</label><input id="pass" type="password" autocomplete="current-password"></div><button class="primary" onclick="signIn()">SE CONNECTER</button><button class="secondary" style="margin-left:8px" onclick="resetPassword()">Mot de passe oublié</button><p class="muted" style="margin-top:14px">Les comptes sont gérés dans Firebase. Pas besoin de créer un compte depuis cette application.</p></div></div>`}
function nav(){if(state.tab==='accueil')return '';return `<div class="bar"><button class="tab" onclick="state.tab='accueil';render()">← RETOUR</button></div>`}
async function render(){if(!state.user)return login();const weather=await getWeather();document.querySelector('#app').innerHTML=`<div class="app"><div class="top"><div class="brand"><img src="icon.png" onclick="signOut()" style="cursor:pointer" title="Se déconnecter"><div><h1>Cahier de RELÈVE</h1><small>${new Date().toLocaleDateString('fr-FR')}${weather.temp!=null?' · 🌡️ '+weather.temp+'°C':''}</small></div></div>${nav()}</div><main class="main" id="content"></main></div>`;const c=$('content');if(!state.profile)return c.innerHTML=`<div class="card"><h2>Profil en attente</h2><p>Ton compte est connecté mais son profil Firebase n'est pas encore disponible.</p></div>`;if(state.tab==='accueil')return home(c);if(state.tab==='consignes')return consignes(c);if(state.tab==='maintenance')return maintenance(c);if(state.tab==='planning')return planning(c);if(state.tab==='secteur')return secteur(c);if(state.tab==='crm')return crm(c);if(state.tab==='documents')return documents(c);if(state.tab==='resume')return resume(c);if(state.tab==='message')return message(c)}
async function home(c){state.day=new Date().toISOString().slice(0,10);let pending=0;try{const tasks=await fsQuery('maintenance_tasks',null,null);const checks=await fsQuery('maintenance_checks',null,null,'checked_at',true);const checkedIds=new Set(checks.map(x=>x.task_id));pending=tasks.filter(t=>!checkedIds.has(t.id)).length}catch(err){}const weather=await getWeather();let vol=null;try{vol=await fsGet('daily_volume',state.day)}catch(e){}state._volCache=vol;c.innerHTML=`<div class="card"><h2 style="margin:0">Bonjour ${esc(state.profile.display_name)} 👋</h2><div class="muted">${fmt(state.day)} · ${weather.temp!=null?'🌡️ '+weather.temp+'°C ('+weather.label+')':'Météo indisponible'}</div></div><div class="grid" style="grid-template-columns:1fr 1fr"><div class="card" style="margin-bottom:0"><div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><b>🚰 Volume épandu</b></div><div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span>${vol&&vol.value!=null?vol.value+' m³/j':'—'}</span>${isNico()?`<button class="secondary" onclick="editVolume()" style="padding:6px 9px">✏️</button>`:''}</div></div><button class="secondary" style="height:auto" onclick="state.tab='resume';render()">📋 Consignes du jour</button></div><div class="grid"><button class="tile" style="--c1:#5aa7ff;--c2:#2a5fd6" onclick="state.tab='consignes';render()"><span class="tile-icon">📋</span><b>CONSIGNES</b></button><button class="tile${pending>0?' tile-alert':''}" style="--c1:#ff9d5c;--c2:#e0631f" onclick="state.tab='maintenance';render()">${pending>0?`<span class="tile-badge">${pending}</span>`:''}<span class="tile-icon">🔧</span><b>MAINTENANCE</b></button><button class="tile" style="--c1:#b48bff;--c2:#6e42d6" onclick="state.tab='planning';render()"><span class="tile-icon">📅</span><b>PLANNING</b></button><button class="tile" style="--c1:#6fd18f;--c2:#1f9a54" onclick="state.tab='secteur';render()"><span class="tile-icon">ℹ️</span><b>INFORMATIONS</b></button><button class="tile" style="--c1:#98a6b8;--c2:#4b5768" onclick="state.tab='crm';render()"><span class="tile-icon">${state.mecaUnlocked?'⚙️':'🔒'}</span><b>MÉCANIQUE (ACCÈS RÉSERVÉ)</b></button><button class="tile" style="--c1:#ffd25c;--c2:#e0a415" onclick="state.tab='documents';render()"><span class="tile-icon">📁</span><b>PHOTOS ÉVÉNEMENTS</b></button></div>`}
async function editVolume(){const current=state._volCache&&state._volCache.value!=null?state._volCache.value:'';const v=prompt('Volume épandu aujourd’hui (m³/j) :',current);if(v===null)return;const num=parseFloat(String(v).replace(',','.'));if(isNaN(num))return toast('Valeur invalide');try{await fsAdd('daily_volume',{value:num,display_name:state.profile.display_name,updated_by:userId(),updated_at:new Date()},state.day);toast('Volume mis à jour');render()}catch(err){toast('Erreur : '+err.message)}}
async function resume(c){try{const notes=await fsQuery('handover_notes','work_date',state.day);let vol=null;try{vol=await fsGet('daily_volume',state.day)}catch(e){}c.innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">📋 Consignes du jour</h2><input type="date" value="${state.day}" onchange="state.day=this.value;render()"></div><p class="muted">${fmt(state.day)}</p></div><div class="card"><b>🚰 Volume épandu :</b> ${vol&&vol.value!=null?vol.value+' m³/j':'—'}</div>${notes.map(n=>`<div class="card note"><div class="row"><b>${esc(n.display_name||'')}</b><span class="muted">${new Date(n.created_at).toLocaleString('fr-FR')}</span></div><p><b>Fait :</b> ${esc(n.done)}</p><p><b>À faire :</b> ${esc(n.next)}</p></div>`).join('')||'<div class="empty">Aucune consigne pour cette journée.</div>'}<div class="card"><button class="primary" onclick="state.tab='consignes';render()">Voir toutes les consignes / jours précédents</button></div>`}catch(err){c.innerHTML=`<div class="card">Erreur : ${esc(err.message)}</div>`}}
async function consignes(c){try{const data=await fsQuery('handover_notes','work_date',state.day);c.innerHTML=`<div class="card"><div class="row"><h2>CONSIGNES</h2><input id="dateC" type="date" value="${state.day}" onchange="state.day=this.value;render()"></div><div class="field"><label>Ce que j’ai fait</label><textarea id="done" rows="3"></textarea></div><div class="field"><label>Ce que la personne suivante doit faire</label><textarea id="next" rows="3"></textarea></div><button class="primary" onclick="addNote()">ENREGISTRER LA RELÈVE</button></div>${data.map(n=>state.editId===n.id?`<div class="card note"><div class="field"><label>Ce que la personne a fait</label><textarea id="editDone" rows="3">${esc(n.done)}</textarea></div><div class="field"><label>Ce que la personne suivante doit faire</label><textarea id="editNext" rows="3">${esc(n.next)}</textarea></div><div style="display:flex;gap:8px"><button class="primary" onclick="saveEditNote('${n.id}')">ENREGISTRER</button><button class="secondary" onclick="cancelEdit()">Annuler</button></div></div>`:`<div class="card note"><div class="row"><b>${esc(n.display_name||n.author_email||'')}</b><span class="muted">${new Date(n.created_at).toLocaleString('fr-FR')}</span></div><p><b>Fait :</b> ${esc(n.done)}</p><p><b>À faire :</b> ${esc(n.next)}</p>${isNico()?`<div style="display:flex;gap:8px;margin-top:8px"><button class="secondary" onclick="editNote('${n.id}')">✏️ Modifier</button><button class="secondary danger" onclick="deleteNote('${n.id}')">🗑 Supprimer</button></div>`:''}</div>`).join('')||'<div class="empty">Aucune consigne pour cette journée.</div>'}`}catch(err){c.innerHTML=`<div class="card">Erreur : ${esc(err.message)}</div>`}}
function editNote(id){state.editId=id;render()}
function cancelEdit(){state.editId=null;render()}
async function saveEditNote(id){const done=$('editDone').value.trim(),next=$('editNext').value.trim();try{const data=await fsQuery('handover_notes','work_date',state.day);const n=data.find(x=>x.id===id);await fsAdd('handover_notes',{work_date:n.work_date,done,next,author_id:n.author_id,display_name:n.display_name,created_at:new Date(n.created_at)},id);toast('Consigne modifiée');state.editId=null;render()}catch(err){toast('Modification impossible : '+err.message)}}
async function deleteNote(id){if(!confirm('Supprimer définitivement cette consigne ?'))return;try{await fsDelete('handover_notes',id);toast('Consigne supprimée');render()}catch(err){toast('Suppression impossible : '+err.message)}}
async function addNote(){const {value:done}= $('done'),next=$('next').value;try{await fsAdd('handover_notes',{work_date:state.day,done:done.trim(),next:next.trim(),author_id:userId(),display_name:state.profile.display_name,created_at:new Date()});toast('Relève enregistrée');render()}catch(err){toast(err.message)}}
function isoWeek(d){const dt=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dayNum=dt.getUTCDay()||7;dt.setUTCDate(dt.getUTCDate()+4-dayNum);const yearStart=new Date(Date.UTC(dt.getUTCFullYear(),0,1));const week=Math.ceil((((dt-yearStart)/86400000)+1)/7);return{week,year:dt.getUTCFullYear()}}
async function maintenance(c){try{const allTasks=await fsQuery('maintenance_tasks',null,null);const checks=await fsQuery('maintenance_checks',null,null,'checked_at',true);const byTask={};checks.forEach(x=>byTask[x.task_id]=x);const active=allTasks.filter(t=>!t.archived),archived=allTasks.filter(t=>t.archived);const todo=active.filter(t=>!byTask[t.id]);const weeks={};active.forEach(t=>{const ch=byTask[t.id];if(!ch)return;const{week,year}=isoWeek(new Date(ch.checked_at));const key=year+'-'+week;if(!weeks[key])weeks[key]={week,year,tasks:[]};weeks[key].tasks.push(t)});const weekKeys=Object.keys(weeks).sort();const archivedWeeks={};archived.forEach(t=>{const ch=byTask[t.id];const{week,year}=isoWeek(ch?new Date(ch.checked_at):new Date(t.created_at));const key=year+'-'+week;if(!archivedWeeks[key])archivedWeeks[key]={week,year,tasks:[]};archivedWeeks[key].tasks.push(t)});const archivedKeys=Object.keys(archivedWeeks).sort();const taskCard=t=>{const ch=byTask[t.id];return `<div class="card"><div class="row"><div><b>${esc(t.title)}</b><div class="muted">Créée par <b>${esc(t.display_name||'')}</b> le ${new Date(t.created_at).toLocaleString('fr-FR')}</div></div>${ch?`<button class="check locked" disabled>✓ CHECKÉ</button>`:`<button class="check" onclick="checkTask('${t.id}')">CHECK</button>`}</div>${ch?`<p class="muted">Validé définitivement par <b>${esc(ch.display_name||'')}</b> le ${new Date(ch.checked_at).toLocaleString('fr-FR')}</p>`:''}${isNico()?`<button class="secondary danger" style="margin-top:8px" onclick="deleteTask('${t.id}')">🗑 Supprimer la tâche</button>`:''}</div>`};let html=`<div class="card"><h2>MAINTENANCE</h2><div class="field"><label>Nouvelle tâche</label><input id="task" placeholder="Ex. Graissage pompe…"></div><button class="primary" onclick="addTask()">+ AJOUTER LA TÂCHE</button></div>`;html+=todo.map(taskCard).join('');weekKeys.forEach(k=>{const g=weeks[k];html+=`<div class="card" style="background:#eef1f4"><div class="row"><b>✅ Checké en semaine ${g.week} (${g.year})</b><button class="secondary" onclick="archiveWeek(${g.year},${g.week})">📦 Archiver cette semaine</button></div></div>`;html+=g.tasks.map(taskCard).join('')});if(!todo.length&&!weekKeys.length)html+='<div class="empty">Aucune tâche de maintenance.</div>';if(archivedKeys.length){html+=`<div class="card"><button class="secondary" onclick="toggleArchives()">${state.showArchives?'Masquer':'Voir'} les archives (${archived.length})</button></div>`;if(state.showArchives)archivedKeys.forEach(k=>{const g=archivedWeeks[k];html+=`<div class="card" style="background:#eef1f4"><b>📦 Archive — Semaine ${g.week} (${g.year})</b></div>`;html+=g.tasks.map(taskCard).join('')})}c.innerHTML=html}catch(err){c.innerHTML=`<div class="card">Erreur : ${esc(err.message)}</div>`}}
function toggleArchives(){state.showArchives=!state.showArchives;render()}
async function archiveWeek(year,week){if(!confirm('Archiver toutes les tâches checkées de la semaine '+week+' ('+year+') ?'))return;try{const allTasks=await fsQuery('maintenance_tasks',null,null);const checks=await fsQuery('maintenance_checks',null,null,'checked_at',true);const byTask={};checks.forEach(x=>byTask[x.task_id]=x);const toArchive=allTasks.filter(t=>{if(t.archived)return false;const ch=byTask[t.id];if(!ch)return false;const w=isoWeek(new Date(ch.checked_at));return w.week===week&&w.year===year});for(const t of toArchive){const{id,...rest}=t;await fsAdd('maintenance_tasks',{...rest,created_at:new Date(rest.created_at),archived:true},id)}toast(toArchive.length+' tâche(s) archivée(s)');render()}catch(err){toast('Erreur : '+err.message)}}
async function deleteTask(id){if(!confirm('Supprimer définitivement cette tâche de maintenance ?'))return;try{await fsDelete('maintenance_tasks',id);toast('Tâche supprimée');render()}catch(err){toast('Suppression impossible : '+err.message)}}
async function addTask(){const v=$('task').value.trim();if(!v)return toast('Saisis une tâche');try{await fsAdd('maintenance_tasks',{title:v,created_by:userId(),display_name:state.profile.display_name,created_at:new Date()});toast('Tâche ajoutée');render()}catch(err){toast(err.message)}}
async function checkTask(id){if(!confirm('Confirmer le CHECK ? Il sera définitif et impossible à annuler.'))return;try{await fsAdd('maintenance_checks',{task_id:id,checked_by:userId(),display_name:state.profile.display_name,checked_at:new Date()},id);toast('CHECK enregistré définitivement');render()}catch(err){toast(err.message.includes('ALREADY_EXISTS')?'Cette tâche est déjà CHECKÉE.':err.message)}}
function planning(c){const colorFor=s=>{if(s.startsWith('Matin'))return['#e6f1ff','#1a56c4'];if(s.startsWith('Après-midi'))return['#fff2e3','#c4620e'];if(s.startsWith('Nuit'))return['#efe6ff','#5b21b6'];return['#eef1f4','#475467']};const emojiFor=s=>s.startsWith('Matin')?'🌅':s.startsWith('Après-midi')?'🌤️':s.startsWith('Nuit')?'🌙':'🛌';const d=state.day;const rows=TEAM.map(n=>{const s=shiftFor(n,d);const[bg,fg]=colorFor(s);return`<div class="card" style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px"><b style="font-size:15px">${n}</b><span class="badge" style="background:${bg};color:${fg};font-weight:700">${emojiFor(s)} ${s}</span></div>`}).join('');c.innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">📅 PLANNING</h2></div><p class="muted" style="margin:4px 0 12px">Rotation 3×8 · 2 matin / 2 après-midi / 2 nuits / 2 repos</p><div class="row" style="gap:8px"><button class="secondary" onclick="state.day=new Date(new Date(state.day+'T12:00:00').getTime()-86400000).toISOString().slice(0,10);render()">‹</button><input id="datePlanning" type="date" value="${d}" onchange="state.day=this.value;render()" style="flex:1;text-align:center;border:1px solid #d0d5dd;border-radius:12px;padding:10px"><button class="secondary" onclick="state.day=new Date(new Date(state.day+'T12:00:00').getTime()+86400000).toISOString().slice(0,10);render()">›</button></div></div><div class="muted" style="margin:0 4px 8px;text-transform:capitalize">${fmt(d)}</div>${rows}`}
async function secteur(c){try{const data=await fsQuery('sector_notes','work_date',state.day);c.innerHTML=`<div class="card"><h2>INFORMATIONS ARCIS-SUR-AUBE</h2><div class="field"><label>Nouvelle information</label><textarea id="sectorText" rows="5" placeholder="Information terrain, parcelle, accès, consigne…"></textarea></div><button class="primary" onclick="saveSector()">ENREGISTRER</button></div>${data.map(n=>`<div class="card note"><div class="row"><b>${esc(n.display_name||'')}</b><span class="muted">${new Date(n.created_at).toLocaleString('fr-FR')}</span></div><p>${esc(n.content)}</p></div>`).join('')||'<div class="empty">Aucune information pour cette journée.</div>'}`}catch(err){c.innerHTML=`<div class="card">Erreur : ${esc(err.message)}</div>`}}
async function saveSector(){const v=$('sectorText').value.trim();if(!v)return toast('Saisis une information');try{await fsAdd('sector_notes',{work_date:state.day,content:v,author_id:userId(),display_name:state.profile.display_name,created_at:new Date()});toast('Information enregistrée');render()}catch(err){toast(err.message)}}
async function crm(c){if(!state.mecaUnlocked){c.innerHTML=`<div class="card" style="text-align:center;padding:36px 16px"><div style="font-size:48px">🔒</div><h2 style="margin:10px 0 4px">MÉCANIQUE</h2><p class="muted">Accès réservé (CRM, Nico, Jean-Yves, Jeremy). Saisis le code pour déverrouiller la saisie.</p><div class="field" style="max-width:220px;margin:14px auto 6px"><input id="mecaCode" type="password" inputmode="numeric" placeholder="Code" style="text-align:center;font-size:20px;letter-spacing:6px" onkeydown="if(event.key==='Enter')unlockMeca()"></div><button class="primary" onclick="unlockMeca()">DÉVERROUILLER</button></div>`;return}try{const data=await fsQuery('mechanical_crm','work_date',state.day);c.innerHTML=`<div class="card"><div class="row"><h2>🔓 MÉCANIQUE</h2><button class="secondary" onclick="lockMeca()">🔒 Verrouiller</button></div><div class="row" style="margin-top:8px"><input type="date" value="${state.day}" onchange="state.day=this.value;render()"></div><div class="field"><label>Compte rendu mécanique</label><textarea id="crmText" rows="6" placeholder="Intervention, panne, pièce, observation, suite à donner…"></textarea></div><button class="primary" onclick="saveCrm()">ENREGISTRER LE CR</button></div>${data.map(n=>`<div class="card note"><div class="row"><b>${esc(n.display_name||'')}</b><span class="muted">${new Date(n.created_at).toLocaleString('fr-FR')}</span></div><p>${esc(n.content)}</p></div>`).join('')||'<div class="empty">Aucun compte rendu mécanique pour cette journée.</div>'}`}catch(err){c.innerHTML=`<div class="card">Erreur : ${esc(err.message)}</div>`}}
function unlockMeca(){const code=$('mecaCode').value.trim();if(code===MECA_CODE){state.mecaUnlocked=true;toast('Accès déverrouillé');render()}else toast('Code incorrect')}
function lockMeca(){state.mecaUnlocked=false;render()}
function message(c){c.innerHTML=`<div class="card"><h2>💬 MESSAGE HORS CAHIER</h2><p class="muted">Pour envoyer une information à quelqu’un sans qu’elle soit enregistrée dans le Cahier de RELÈVE.</p><div class="field"><label>Message</label><textarea id="quickMsg" rows="6" placeholder="Écris ton message ici…"></textarea></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="openWhatsApp()">🟢 OUVRIR WHATSAPP</button><button class="secondary" onclick="shareQuick()">📤 PARTAGER</button></div><p class="muted" style="margin-top:12px">🔒 Ce message n’est pas enregistré dans Firebase ni dans le Cahier.</p></div>`}
function openWhatsApp(){const v=$('quickMsg').value.trim();if(!v)return toast('Écris ton message');window.open('https://wa.me/?text='+encodeURIComponent(v),'_blank')}
async function shareQuick(){const v=$('quickMsg').value.trim();if(!v)return toast('Écris ton message');if(navigator.share){try{await navigator.share({text:v})}catch(e){}}else openWhatsApp()}
async function saveCrm(){const v=$('crmText').value.trim();if(!v)return toast('Saisis un compte rendu');try{await fsAdd('mechanical_crm',{work_date:state.day,content:v,author_id:userId(),display_name:state.profile.display_name,created_at:new Date()});toast('Compte rendu mécanique enregistré');render()}catch(err){toast(err.message)}}
async function documents(c){try{const data=await fsQuery('documents',null,null);c.innerHTML=`<div class="card"><h2>📁 PHOTOS ÉVÉNEMENTS</h2><p class="muted">Photos consultables par toute l’équipe.</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="primary" onclick="$('photoInput').click()">📷 PRENDRE UNE PHOTO</button></div><input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none" onchange="uploadPhoto(event)"></div>${data.map(d=>`<div class="card"><div class="row"><b>${esc(d.display_name||'')}</b><span class="muted">${new Date(d.created_at).toLocaleString('fr-FR')}</span></div><img src="data:image/jpeg;base64,${d.data}" style="width:100%;border-radius:12px;margin-top:8px;display:block">${d.caption?`<p style="margin-top:8px">${esc(d.caption)}</p>`:''}</div>`).join('')||'<div class="empty">Aucune photo pour le moment.</div>'}`}catch(err){c.innerHTML=`<div class="card">Erreur : ${esc(err.message)}</div>`}}
function compressImage(file,maxWidth,quality){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxWidth){h=Math.round(h*maxWidth/w);w=maxWidth}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality).split(',')[1])};img.onerror=reject;img.src=e.target.result};reader.onerror=reject;reader.readAsDataURL(file)})}
async function uploadPhoto(ev){const file=ev.target.files[0];if(!file)return;const caption=(prompt('Légende de la photo (optionnel) :','')||'').trim();try{toast('Compression de la photo…');const base64=await compressImage(file,1000,0.65);if(base64.length>900000){toast('Photo trop volumineuse même après compression, réessaie.');ev.target.value='';return}await fsAdd('documents',{data:base64,caption,uploaded_by:userId(),display_name:state.profile.display_name,created_at:new Date()});toast('Photo ajoutée');ev.target.value='';render()}catch(err){toast('Envoi impossible : '+err.message)}}
if(localStorage.getItem('firebase_uid'))load();else render();
</script></body></html>
